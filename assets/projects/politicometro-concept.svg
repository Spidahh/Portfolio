<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Politicometro, concept editoriale</title>
  <desc id="desc">Una scheda editoriale dimostrativa che collega promessa, fatto, prova ed esito.</desc>
  <rect width="1200" height="780" fill="#f1ebdd"/>
  <path d="M0 0h1200v22H0z" fill="#d72828"/>
  <g fill="#151515">
    <text x="72" y="98" font-family="Georgia, serif" font-size="24" font-weight="700" letter-spacing="4">POLITICOMETRO</text>
    <text x="1090" y="98" font-family="Arial, sans-serif" font-size="14" text-anchor="end" letter-spacing="2">CONCEPT EDITORIALE</text>
    <path d="M72 126h1056" stroke="#151515" stroke-width="3"/>
    <text x="72" y="206" font-family="Georgia, serif" font-size="68" font-weight="700">Che fine ha fatto?</text>
    <text x="72" y="252" font-family="Arial, sans-serif" font-size="22">Una decisione pubblica, seguita oltre il titolo del giorno.</text>
  </g>
  <g transform="translate(72 324)">
    <path d="M0 62h1056" stroke="#151515" stroke-width="2"/>
    <path d="M0 190h1056M0 318h1056" stroke="#151515" stroke-opacity=".24"/>
    <path d="M198 0v384M470 0v384M752 0v384" stroke="#151515" stroke-opacity=".22"/>
    <g font-family="Arial, sans-serif">
      <text x="0" y="26" font-size="14" font-weight="700" letter-spacing="3" fill="#d72828">01 / PROMESSA</text>
      <text x="226" y="26" font-size="14" font-weight="700" letter-spacing="3" fill="#d72828">02 / FATTO</text>
      <text x="498" y="26" font-size="14" font-weight="700" letter-spacing="3" fill="#d72828">03 / PROVA</text>
      <text x="780" y="26" font-size="14" font-weight="700" letter-spacing="3" fill="#d72828">04 / ESITO</text>
    </g>
    <g fill="#151515" font-family="Georgia, serif" font-size="27">
      <text x="0" y="112">Cosa è stato</text>
      <text x="0" y="146">annunciato?</text>
      <text x="226" y="112">Cosa è successo</text>
      <text x="226" y="146">davvero?</text>
      <text x="498" y="112">Quali fonti lo</text>
      <text x="498" y="146">dimostrano?</text>
      <text x="780" y="112">Che cosa è cambiato</text>
      <text x="780" y="146">per le persone?</text>
    </g>
    <g font-family="Arial, sans-serif" font-size="18" fill="#151515">
      <text x="0" y="248">Dichiarazione originale</text>
      <text x="226" y="248">Cronologia verificata</text>
      <text x="498" y="248">Documenti e correzioni</text>
      <text x="780" y="248">Conseguenze osservabili</text>
    </g>
    <g transform="translate(0 338)">
      <rect width="1056" height="46" fill="#151515"/>
      <text x="22" y="30" fill="#f1ebdd" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">FATTI · DATE · FONTI · RESPONSABILITÀ · CORREZIONI</text>
      <circle cx="1014" cy="23" r="9" fill="#d72828"/>
    </g>
  </g>
</svg>
